name: Android Build

# 每次 push / PR 都跑单测；main 上 push 与手动触发额外产出签名 release，
# 以后 APK 只从这里的 artifact 拿，不再本地编译。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant (release is signed)"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || (github.ref == 'refs/heads/main' && 'release' || 'debug') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        # setup-java 设置的 JAVA_HOME 只存在于 shell 环境，${{ env.JAVA_HOME }} 取不到，
        # 必须在 shell 里导出，测试 JVM 才会真正用 JDK 21（Robolectric 渲染用例需要）。
        run: |
          export NEKOSU_TEST_JAVA_HOME="$JAVA_HOME"
          ./gradlew testDebugUnitTest

      - name: Decode release keystore
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NEKOSU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NEKOSU_KEYSTORE_BASE64 secret 未配置，无法构建签名 release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nekosu-release.jks"
          chmod 600 "$RUNNER_TEMP/nekosu-release.jks"

      - name: Build signed release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') }}
        env:
          NEKOSU_KEYSTORE_FILE: ${{ runner.temp }}/nekosu-release.jks
          NEKOSU_KEYSTORE_PASSWORD: ${{ secrets.NEKOSU_KEYSTORE_PASSWORD }}
          NEKOSU_KEY_ALIAS: ${{ secrets.NEKOSU_KEY_ALIAS }}
          NEKOSU_KEY_PASSWORD: ${{ secrets.NEKOSU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature and report SHA-256
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256.txt"

      - name: Build debug (PR / manual)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug') }}
        run: ./gradlew assembleDebug

      - name: Upload signed release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release') }}
        uses: actions/upload-artifact@v6
        with:
          name: NekoSU-release-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug') }}
        uses: actions/upload-artifact@v6
        with:
          name: NekoSU-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
