# 测试基线统一在 minSdk（31）上跑。
#
# 两个原因：
#   1. Robolectric 用内置的 AOSP PackageParser 解析合并后的 manifest，
#      android:minSdkVersion=31 在 sdk=30 的沙箱里会直接失败
#      （"Requires newer sdk version #31 (current version is #30)"）；
#   2. targetSdk 是 37，Robolectric 4.16 还没有对应的 android-all，
#      没写 @Config 的测试会掉到不支持的 SDK 上。
sdk=31
