[package]
name = "store"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "store"
crate-type = ["cdylib", "rlib"]

[dependencies]
proto = { path = "../proto" }
log.workspace = true
libc = "0.2.191"

# Kernel application (set_profile/feature_set on boot) is Android-only. Keeping
# kzcall target-gated lets the persistence half and the C ABI build and test on
# the host while Android builds keep the full behaviour.
[target.'cfg(target_os = "android")'.dependencies]
kzcall = { path = "../kzcall" }
